<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkSanitizer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container" id="container">

    <!-- ── Header ── -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">LinkSanitizer</span>
      </div>

      <!-- Rounded toggle switch (Replit-style) -->
      <div class="toggle-wrap">
        <label class="switch">
          <input type="checkbox" id="enabledToggle" checked />
          <span class="slider"></span>
        </label>
        <span id="toggleStatus" class="active"></span>
      </div>
    </header>

    <div class="divider"></div>

    <!-- ── Counter + actions ── -->
    <section class="counter-section">
      <p class="counter-label" id="counterLabel"></p>
      <span class="counter-value" id="counterValue">—</span>
      <span class="counter-unit" id="counterUnit"></span>

      <!-- Stacked buttons: clean on top (primary), clipboard (secondary), reset below (subtle) -->
      <div class="btn-stack">
        <button class="btn btn-clean" id="cleanTabBtn"></button>
        <button class="btn btn-clean" id="cleanClipboardBtn"></button>
        <button class="btn btn-reset" id="resetBtn"></button>
      </div>
      <p class="clean-feedback" id="cleanFeedback"></p>
    </section>

    <div class="divider"></div>

    <!-- ── Params scroll row ── -->
    <section class="params-section">
      <div class="params-header">
        <span class="params-summary" id="paramsTitle">PARAMETRI MONITORATI (SCORRI ➔)</span>
      </div>
      <div class="params-scroll-row">
        <span class="param-tag">utm_*</span>
        <span class="param-tag">fbclid</span>
        <span class="param-tag">gclid</span>
        <span class="param-tag">gbraid</span>
        <span class="param-tag">wbraid</span>
        <span class="param-tag">ttclid</span>
        <span class="param-tag">si</span>
        <span class="param-tag">igsh</span>
        <span class="param-tag">igshid</span>
        <span class="param-tag">twclid</span>
        <span class="param-tag">msclkid</span>
        <span class="param-tag">li_fat_id</span>
        <span class="param-tag">rdt_cid</span>
        <span class="param-tag">mc_eid</span>
        <span class="param-tag">_hsenc</span>
        <span class="param-tag">_ga</span>
        <span class="param-tag">+ more</span>
      </div>
    </section>

    <div class="divider"></div>

    <!-- ── Allowlist ── -->
    <section class="allowlist-section">
      <p class="section-title" id="allowlistTitle"></p>
      <p class="allowlist-hint" id="allowlistHint"></p>
      <div class="allowlist-input-row">
        <input
          type="text"
          id="allowlistInput"
          class="allowlist-input"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="btn-add" id="allowlistAddBtn">+</button>
      </div>
      <ul class="allowlist-items" id="allowlistItems"></ul>
    </section>

    <div class="divider"></div>

    <!-- ── Footer / Feedback ── -->
    <footer class="footer">
      <a href="https://github.com/ttarragoni/LinkSanitizer/issues" target="_blank" rel="noopener noreferrer" class="feedback-link" id="feedbackLink"></a>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
